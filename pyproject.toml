[project]
name = "figurekit"
version = "0.5.1"
description = "One figure style for every project: light and dark themes, transparent SVG and PNG, Bricolage Grotesque and JetBrains Mono, reproducible files."
dynamic = ["readme"]
license = "MIT"
license-files = ["LICENSE", "src/figkit/fonts/OFL-*.txt"]
requires-python = ">=3.12"
dependencies = ["matplotlib>=3.9", "numpy>=1.26", "pillow>=10.4"]
keywords = ["matplotlib", "figures", "plotting", "style", "dark mode", "svg"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Framework :: Matplotlib",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Visualization",
    "Typing :: Typed",
]

[project.urls]
Repository = "https://github.com/BenBotsch/FigureKit"
Issues = "https://github.com/BenBotsch/FigureKit/issues"
Changelog = "https://github.com/BenBotsch/FigureKit/blob/main/CHANGELOG.md"

[project.scripts]
figkit = "figkit.cli:main"

[dependency-groups]
dev = [
    "fonttools>=4.55",
    "mypy>=1.15",
    "pre-commit>=4.0",
    "pytest>=8.3",
    "ruff>=0.11",
]

[build-system]
requires = ["hatchling", "hatch-fancy-pypi-readme"]
build-backend = "hatchling.build"

# PyPI shows the README without the repository, so relative images and links point to GitHub.
[tool.hatch.metadata.hooks.fancy-pypi-readme]
content-type = "text/markdown"

[[tool.hatch.metadata.hooks.fancy-pypi-readme.fragments]]
path = "README.md"

[[tool.hatch.metadata.hooks.fancy-pypi-readme.substitutions]]
pattern = '(src=")(?!https?://)'
replacement = '\1https://raw.githubusercontent.com/BenBotsch/FigureKit/main/'

[[tool.hatch.metadata.hooks.fancy-pypi-readme.substitutions]]
pattern = '(\]\()(?!https?://|#)'
replacement = '\1https://github.com/BenBotsch/FigureKit/blob/main/'

[tool.hatch.build.targets.wheel]
packages = ["src/figkit"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "PL", "RUF", "D"]
ignore = ["PLR2004", "D100", "D104", "D105", "D107"]

# Plotting helpers take the axes, the data and a few keyword-only options.
[tool.ruff.lint.pylint]
max-args = 8

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["D", "PLR2004"]
"scripts/*" = ["T201"]

[tool.mypy]
strict = true
files = ["src", "tests", "scripts"]

[[tool.mypy.overrides]]
module = ["fontTools.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
