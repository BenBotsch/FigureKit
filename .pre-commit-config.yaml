# Install once with `uv run pre-commit install`. CI runs every hook on all files.
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-yaml
      - id: check-toml
      - id: check-json
      - id: end-of-file-fixer
        exclude: \.svg$
      - id: trailing-whitespace
        # matplotlib ends SVG path lines with a space, and licence texts stay verbatim.
        exclude: (\.svg|OFL-.*\.txt)$
      - id: check-added-large-files
        args: [--maxkb=512]
  # Ruff from uv.lock, so pre-commit, CI and the editor use the same version.
  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check
        entry: uv run --frozen ruff check --fix
        language: system
        types_or: [python, pyi]
        require_serial: true
      - id: ruff-format
        name: ruff format
        entry: uv run --frozen ruff format
        language: system
        types_or: [python, pyi]
        require_serial: true
