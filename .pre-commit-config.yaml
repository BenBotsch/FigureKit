# Install once with `uv run pre-commit install`. CI runs every hook on all files.
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-yaml
      - id: check-toml
      - id: check-json
      - id: end-of-file-fixer
        exclude: \.svg$
      - id: trailing-whitespace
        # matplotlib ends SVG path lines with a space, and licence texts stay verbatim.
        exclude: (\.svg|OFL-.*\.txt)$
      - id: check-added-large-files
        args: [--maxkb=512]
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.3
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format
