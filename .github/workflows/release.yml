name: Release

# A pushed tag v<version> builds the package, tests the wheel on every platform and publishes the
# package on PyPI and the GitHub release with the wheel, the source archive and the notes from
# CHANGELOG.md.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Tag matches the version in pyproject.toml
        run: |
          version="$(uv version --short)"
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "tag $GITHUB_REF_NAME does not match version $version" >&2
            exit 1
          fi
      # Fails before anything is built if the changelog lacks the version.
      - run: uv run --no-project python scripts/release_notes.py "$GITHUB_REF_NAME" > notes.md
      - run: uv build
      - uses: actions/upload-artifact@v4
        with:
          name: release
          path: |
            dist/
            notes.md
          if-no-files-found: error

  wheel:
    needs: build
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - uses: actions/download-artifact@v4
        with:
          name: release
      - run: bash scripts/check_package.sh
        shell: bash

  # Trusted publishing: PyPI accepts the upload from this workflow in the environment pypi, so
  # the repository holds no token. A version that PyPI already has fails here, before GitHub.
  pypi:
    needs: wheel
    runs-on: ubuntu-24.04
    environment:
      name: pypi
      url: https://pypi.org/project/figurekit/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: release
      - uses: pypa/gh-action-pypi-publish@release/v1

  publish:
    needs: pypi
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: release
      # A release made by hand keeps its notes and gets the files.
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" dist/* --clobber
          else
            gh release create "$GITHUB_REF_NAME" dist/* --verify-tag \
              --title "$GITHUB_REF_NAME" --notes-file notes.md
          fi
